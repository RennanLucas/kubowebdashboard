    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Anti-FOUC Theme Initializer: Default to light on first access -->
    <script>
      (function() {
        try {
          var canonical = localStorage.getItem('kuboweb:theme');
          var legacy = localStorage.getItem('theme');
          var stored = canonical || legacy;
          if (!canonical && legacy) {
            try { localStorage.setItem('kuboweb:theme', legacy); } catch (e) {}
          }
          var isDark = false;
          if (stored === 'dark') {
            isDark = true;
          } else if (stored === 'system') {
            isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          } else {
            isDark = false;
          }
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
          var metaTheme = document.querySelector('meta[name="theme-color"]');
          if (metaTheme) {
            metaTheme.setAttribute('content', isDark ? '#0a0b14' : '#ffffff');
          }
        } catch (e) {}
      })();
    </script>
    <title>Kubo Analytics | Entenda seu site. Decida melhor.</title>
